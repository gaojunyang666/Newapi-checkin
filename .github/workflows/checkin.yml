name: UGQ 每日签到

on:
  # UTC 00:00 = 北京时间 08:00 启动，准备就绪后在 09:00 前随机签到。
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  # 更新签到代码后立即验证；不改变每日签到时间。
  push:
    branches: [main]
    paths:
      - 'checkin.py'
      - 'tests/test_login_recovery.py'
      - '.github/workflows/checkin.yml'

permissions:
  contents: read

concurrency:
  group: ugq-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查签到凭据
        env:
          UGQ_PASSWORD: ${{ secrets.UGQ_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys
          if not os.environ.get('UGQ_PASSWORD'):
              print('::error::请先在仓库 Settings → Secrets and variables → Actions 添加 UGQ_PASSWORD。')
              sys.exit(1)
          print('密码配置已存在；不会打印密码。')
          PY

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 验证自动登录逻辑
        run: python -m unittest discover -s tests -v

      - name: 安装浏览器依赖
        run: |
          python -m playwright install --with-deps chromium
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: 等待北京时间 08:00—09:00 内的随机时间
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import math
          import secrets
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Asia/Shanghai')
          now = datetime.now(tz)
          start = now.replace(hour=8, minute=0, second=0, microsecond=0)
          end = start + timedelta(hours=1)
          if now >= end:
              print('GitHub 调度已超过北京时间 09:00，本次立即补签。')
          else:
              earliest = max(now, start)
              seconds_left = max(1, math.ceil((end - earliest).total_seconds()))
              target = earliest + timedelta(seconds=secrets.randbelow(seconds_left))
              print(f'本次随机签到时间：{target:%Y-%m-%d %H:%M:%S}（北京时间）', flush=True)
              while True:
                  remaining = (target - datetime.now(tz)).total_seconds()
                  if remaining <= 0:
                      break
                  time.sleep(min(remaining, 60))
          PY

      - name: 登录 UGQ 并签到
        env:
          UGQ_USERNAME: ${{ secrets.UGQ_USERNAME || 'gaojunyang' }}
          UGQ_PASSWORD: ${{ secrets.UGQ_PASSWORD }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          xvfb-run --auto-servernum python - <<'PY'
          import json
          import os
          from checkin import NewAPICheckin, main

          # 每次创建空会话，由脚本使用 Secrets 自动登录。
          # 不依赖 ChatGPT 云端浏览器，也无需手动复制 Cookie。
          os.environ.pop('CONFIG_URL', None)
          os.environ.pop('CONFIG_AUTH', None)
          client = NewAPICheckin(
              'https://ugq.ai', '',
              login_username=os.environ['UGQ_USERNAME'],
              login_password=os.environ['UGQ_PASSWORD'],
          )
          if not client._try_login():
              raise SystemExit('UGQ 自动登录未成功；本次未执行签到，请查看上方登录结果。')
          os.environ['NEWAPI_ACCOUNTS'] = json.dumps([{
              'url': 'https://ugq.ai',
              'session': client.session_cookie,
              'user_id': client.user_id,
              'access_token': client.access_token,
              'name': 'UGQ',
              'login_username': os.environ['UGQ_USERNAME'],
              'login_password': os.environ['UGQ_PASSWORD'],
          }])
          main()
          PY
